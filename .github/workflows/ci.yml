name: Track 4 verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run contracts, leakage checks, models, and UI tests
        run: python -m pytest -q
      - name: Rebuild evaluation without credentials
        run: python -m vaultdata.ml.evaluate --output artifacts/ci-evaluation
      - name: Preserve measured results
        uses: actions/upload-artifact@v4
        with:
          name: track4-evaluation
          path: artifacts/ci-evaluation/
